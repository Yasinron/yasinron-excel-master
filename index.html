<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d47a1">
<meta name="description" content="Yasin Ron - Excel Formula Master">
<link rel="manifest" href="manifest.json">
<title>Yasin Ron – Excel Formula Master</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#0d47a1;color:white;padding:28px 20px 22px;border-radius:0 0 24px 24px}
.brand{font-size:30px;font-weight:800}.tag{opacity:.9;margin-top:5px}
main{padding:16px;max-width:760px;margin:auto}.search{width:100%;padding:15px;border:1px solid #d7dce5;border-radius:14px;font-size:16px}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0}.chip{border:0;border-radius:20px;padding:9px 13px;background:white;white-space:nowrap}
.chip.active{background:#0d47a1;color:white}.card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #00000010}
.name{font-size:19px;font-weight:700;color:#1565c0}.cat{font-size:12px;color:#77808f;margin:5px 0}.formula{font-family:monospace;background:#f1f4f8;padding:10px;border-radius:9px;overflow:auto}
button.install{width:100%;padding:14px;border:0;border-radius:13px;background:#1565c0;color:white;font-size:16px;font-weight:700;margin:8px 0}
small{color:#697386}
</style>
</head>
<body>
<header><div class="brand">Yasin Ron</div><div class="tag">Excel Formula Master</div></header>
<main>
<button class="install" id="installBtn" hidden>📲 Install App</button>
<input class="search" id="search" placeholder="🔎 Search formula, category or keyword">
<div class="chips" id="chips"></div>
<div id="count"></div><section id="list"></section>
</main>
<script>
const formulas=[
["AVERAGE","Statistical","=AVERAGE(B2:B100)","Calculates the average."],
["AND","Logical",'=AND(B2>=80,C2="Yes")',"Checks whether all conditions are TRUE."],
["COUNTIF","Statistical",'=COUNTIF(A:A,"Present")',"Counts cells matching one condition."],
["COUNTIFS","Statistical",'=COUNTIFS(A:A,"Pune",B:B,">90")',"Counts rows matching multiple conditions."],
["DATEDIF","Date & Time",'=DATEDIF(A2,B2,"Y")',"Finds difference between dates."],
["FILTER","Dynamic Array",'=FILTER(A2:D100,D2:D100="Open","No results")',"Returns rows matching a condition."],
["IF","Logical",'=IF(B2>=80,"Pass","Fail")',"Returns a result based on a condition."],
["IFERROR","Logical","=IFERROR(A2/B2,0)","Replaces errors with a chosen result."],
["INDEX","Lookup & Reference","=INDEX(E:E,MATCH(A2,D:D,0))","Returns a value from a position."],
["INDEX + XMATCH","Lookup & Reference","=INDEX(E:E,XMATCH(A2,D:D))","Modern lookup combination."],
["LEFT","Text","=LEFT(A2,5)","Returns characters from the left."],
["LEN","Text","=LEN(A2)","Counts characters."],
["LOWER","Text","=LOWER(A2)","Converts text to lowercase."],
["MATCH","Lookup & Reference","=MATCH(A2,D:D,0)","Returns the position of a match."],
["MAX","Statistical","=MAX(B2:B100)","Returns the largest value."],
["MIN","Statistical","=MIN(B2:B100)","Returns the smallest value."],
["NETWORKDAYS","Date & Time","=NETWORKDAYS(A2,B2)","Counts working days between dates."],
["NOW","Date & Time","=NOW()","Returns current date and time."],
["OR","Logical",'=OR(B2="Yes",C2="Yes")',"TRUE when any condition is TRUE."],
["PROPER","Text","=PROPER(A2)","Capitalizes each word."],
["RIGHT","Text","=RIGHT(A2,5)","Returns characters from the right."],
["ROUND","Math & Trigonometry","=ROUND(A2,2)","Rounds to specified digits."],
["SORT","Dynamic Array","=SORT(A2:C100,2,1)","Sorts data dynamically."],
["SUM","Math & Trigonometry","=SUM(B2:B100)","Adds numbers."],
["SUMIF","Math & Trigonometry",'=SUMIF(A:A,"Sales",B:B)',"Adds values meeting one condition."],
["SUMIFS","Math & Trigonometry",'=SUMIFS(C:C,A:A,"Pune",B:B,">100")',"Adds values meeting multiple conditions."],
["TEXTJOIN","Text",'=TEXTJOIN(", ",TRUE,A2:A10)',"Combines text with a delimiter."],
["TODAY","Date & Time","=TODAY()","Returns today's date."],
["TRIM","Text","=TRIM(A2)","Removes extra spaces."],
["UNIQUE","Dynamic Array","=UNIQUE(A2:A100)","Returns unique values."],
["UPPER","Text","=UPPER(A2)","Converts text to uppercase."],
["VLOOKUP","Lookup & Reference","=VLOOKUP(A2,D:E,2,FALSE)","Traditional lookup."],
["XLOOKUP","Lookup & Reference",'=XLOOKUP(A2,D:D,E:E,"Not Found")',"Finds a value and returns its match."]
];
let active="All";
const chips=["All","A–Z","Lookup","Logical","Text","Date","Math","Statistics","Dynamic"];
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 let a=formulas.filter(f=>{
  const cat=active==="All"||active==="A–Z"||(active==="Lookup"&&f[1].includes("Lookup"))||(active==="Date"&&f[1].includes("Date"))||(active==="Math"&&f[1].includes("Math"))||(active==="Statistics"&&f[1].includes("Statistical"))||f[1].startsWith(active);
  return cat && (f.join(" ").toLowerCase().includes(q));
 }).sort((x,y)=>x[0].localeCompare(y[0]));
 document.getElementById("count").innerHTML="<small>"+a.length+" formulas • Tap a formula for details</small>";
 document.getElementById("list").innerHTML=a.map(f=>`<article class="card" onclick='detail(${JSON.stringify(f)})'><div class="name">${f[0]}</div><div class="cat">${f[1]}</div><div class="formula">${f[2]}</div><p>${f[3]}</p></article>`).join("");
}
function detail(f){
 alert(f[0]+"\n\nFormula:\n"+f[2]+"\n\n"+f[3]+"\n\nPractical office use: reporting, productivity, attendance, targets, SLA and data cleaning.");
}
document.getElementById("chips").innerHTML=chips.map(c=>`<button class="chip ${c==="All"?"active":""}" onclick="active='${c}';document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));this.classList.add('active');render()">${c}</button>`).join("");
document.getElementById("search").oninput=render; render();

let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.getElementById("installBtn").hidden=false});
document.getElementById("installBtn").onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById("installBtn").hidden=true}};
if("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
</script>
</body></html>
