<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<title>Excel Formula Master</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#18212b}
header{background:linear-gradient(135deg,#0d47a1,#1976d2);color:#fff;padding:22px 18px 20px;border-radius:0 0 24px 24px}
h1{margin:0;font-size:25px}.sub{opacity:.88;margin-top:5px;font-size:13px}
.search{margin-top:17px;background:#fff;border:0;border-radius:14px;padding:14px 15px;width:100%;font-size:16px;outline:0}
.tabs{display:flex;gap:8px;overflow:auto;padding:13px 12px 5px;background:#fff;position:sticky;top:0;z-index:3}
.tab{white-space:nowrap;border:1px solid #d7e0ea;background:#fff;border-radius:20px;padding:9px 13px}.tab.active{background:#1565c0;color:#fff;border-color:#1565c0}
main{padding:14px 12px 35px}.hero{background:#fff;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 3px 14px #0000000b}
.hero h2{margin:0 0 6px;font-size:18px}.hero p{margin:0;color:#637080;font-size:13px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 2px 10px #0000000a;cursor:pointer}.name{font-weight:700;color:#135a9c;font-size:17px}.cat{font-size:11px;color:#778492;margin:5px 0}.syn{font-size:12px;color:#46515c;line-height:1.35}
button{font:inherit}.fav{float:right;border:0;background:none;font-size:20px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.close{float:right;border:0;background:#edf2f7;border-radius:50%;width:35px;height:35px}.code{background:#eef5ff;border-radius:12px;padding:13px;word-break:break-word;color:#0d4f8c;font-family:monospace}.copy{background:#1565c0;color:#fff;border:0;padding:12px 16px;border-radius:11px;margin:10px 0}.gen textarea{width:100%;min-height:110px;border:1px solid #ccd6e0;border-radius:13px;padding:12px;font-size:15px}.gen select{width:100%;padding:12px;border-radius:11px;border:1px solid #ccd6e0;margin:8px 0}.empty{text-align:center;color:#778492;padding:35px}.small{font-size:12px;color:#6b7785}
@media(min-width:700px){main{max-width:900px;margin:auto}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<h1>Excel Formula Master</h1><div class="sub">A–Z formulas • Office examples • Formula Generator</div>
<input id="search" class="search" placeholder="🔎 Search formula, category or keyword...">
</header>
<div class="tabs" id="tabs"></div>
<main>
<div class="hero">
<h2>🧮 Formula Generator</h2>
<p>Apni Excel problem simple words me likho. App matching formulas suggest karega.</p>
<div class="gen" style="margin-top:12px"><textarea id="problem" placeholder="Example: Employee ID ke basis par name nikalna hai"></textarea>
<select id="genType"><option>Auto Suggest</option><option>Lookup</option><option>Conditional</option><option>Text</option><option>Date</option><option>Summary</option></select>
<button class="copy" onclick="generate()">Generate Formula</button>
<div id="genResult"></div></div>
</div>
<div id="count" class="small"></div>
<div id="grid" class="grid"></div>
</main>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="detail"></div></div></div>
<script>
const F=[
["AVERAGE","Statistical","=AVERAGE(B2:B100)","Calculates the average.","Average of scores, productivity or values.","AVERAGE"],
["AND","Logical","=AND(B2>=80,C2=\"Yes\")","TRUE only when all conditions are TRUE.","Check whether two conditions are both met.","AND"],
["COUNTIF","Statistical","=COUNTIF(A:A,\"Present\")","Counts cells matching one condition.","Count Present/Absent, status, etc.","COUNTIF"],
["COUNTIFS","Statistical","=COUNTIFS(A:A,\"Pune\",B:B,\">90\")","Counts rows matching multiple conditions.","Count employees by city and score.","COUNTIFS"],
["DATEDIF","Date & Time","=DATEDIF(A2,B2,\"Y\")","Finds difference between two dates.","Calculate completed years/months/days.","DATEDIF"],
["FILTER","Dynamic Array","=FILTER(A2:D100,D2:D100=\"Open\",\"No results\")","Returns only rows that meet a condition.","Show only Open cases.","FILTER"],
["IF","Logical","=IF(B2>=80,\"Pass\",\"Fail\")","Returns different results based on a condition.","Pass/Fail, target status, attendance.","IF"],
["IFERROR","Logical","=IFERROR(A2/B2,0)","Replaces an error with your chosen result.","Avoid #DIV/0! and lookup errors.","IFERROR"],
["INDEX","Lookup & Reference","=INDEX(E:E,MATCH(A2,D:D,0))","Returns a value from a selected position.","Flexible lookup with MATCH.","INDEX"],
["INDEX + XMATCH","Lookup & Reference","=INDEX(E:E,XMATCH(A2,D:D))","Modern flexible lookup combination.","Find a matching employee and return another column.","INDEX"],
["LEFT","Text","=LEFT(A2,5)","Returns characters from the left.","Extract codes/prefixes.","LEFT"],
["LEN","Text","=LEN(A2)","Counts characters.","Check ID/name length.","LEN"],
["LOWER","Text","=LOWER(A2)","Converts text to lowercase.","Normalize email/text.","LOWER"],
["MATCH","Lookup & Reference","=MATCH(A2,D:D,0)","Returns the position of a matching value.","Find row position.","MATCH"],
["MAX","Statistical","=MAX(B2:B100)","Returns the largest value.","Highest achievement/productivity.","MAX"],
["MIN","Statistical","=MIN(B2:B100)","Returns the smallest value.","Lowest value.","MIN"],
["NETWORKDAYS","Date & Time","=NETWORKDAYS(A2,B2)","Counts working days between dates.","Working-day calculation.","NETWORKDAYS"],
["NOW","Date & Time","=NOW()","Returns current date and time.","Timestamp/current time.","NOW"],
["OR","Logical","=OR(B2=\"Yes\",C2=\"Yes\")","TRUE when any condition is TRUE.","Check alternative conditions.","OR"],
["PROPER","Text","=PROPER(A2)","Capitalizes each word.","Clean names and titles.","PROPER"],
["RIGHT","Text","=RIGHT(A2,5)","Returns characters from the right.","Extract last digits/code.","RIGHT"],
["ROUND","Math & Trigonometry","=ROUND(A2,2)","Rounds to specified digits.","Round calculations to 2 decimals.","ROUND"],
["SORT","Dynamic Array","=SORT(A2:C100,2,1)","Sorts data dynamically.","Create sorted report.","SORT"],
["SUM","Math & Trigonometry","=SUM(B2:B100)","Adds numbers.","Total sales, hours, counts.","SUM"],
["SUMIF","Math & Trigonometry","=SUMIF(A:A,\"Sales\",B:B)","Adds values meeting one condition.","Sum sales by team/status.","SUMIF"],
["SUMIFS","Math & Trigonometry","=SUMIFS(C:C,A:A,\"Pune\",B:B,\">100\")","Adds values meeting multiple conditions.","Multi-condition reporting.","SUMIFS"],
["TEXTJOIN","Text","=TEXTJOIN(\", \",TRUE,A2:A10)","Combines text with a delimiter.","Create comma-separated names.","TEXTJOIN"],
["TODAY","Date & Time","=TODAY()","Returns today's date.","Ageing/SLA/date calculations.","TODAY"],
["TRIM","Text","=TRIM(A2)","Removes extra spaces.","Clean copied data.","TRIM"],
["UNIQUE","Dynamic Array","=UNIQUE(A2:A100)","Returns unique values.","Create unique employee/team lists.","UNIQUE"],
["UPPER","Text","=UPPER(A2)","Converts text to uppercase.","Normalize codes.","UPPER"],
["VLOOKUP","Lookup & Reference","=VLOOKUP(A2,D:E,2,FALSE)","Looks up a value in the first table column.","Traditional lookup.","VLOOKUP"],
["XLOOKUP","Lookup & Reference","=XLOOKUP(A2,D:D,E:E,\"Not Found\")","Finds a value and returns the matching result.","Employee ID → Name, team, score.","XLOOKUP"]
].map(x=>({name:x[0],cat:x[1],syntax:x[2],desc:x[3],example:x[4],tag:x[5]}));
const cats=["All","A–Z","Lookup & Reference","Logical","Text","Date & Time","Math & Trigonometry","Statistical","Dynamic Array"];
let active="All", favorites=new Set(JSON.parse(localStorage.getItem("efav")||"[]"));
function renderTabs(){tabs.innerHTML=cats.map(c=>`<button class="tab ${active==c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("")}
function setCat(c){active=c;renderTabs();render()}
function render(){
 let q=search.value.toLowerCase();
 let arr=F.filter(f=>(active=="All"||active=="A–Z"||f.cat==active)&&(!q||(f.name+f.cat+f.desc+f.example).toLowerCase().includes(q)));
 count.textContent=`${arr.length} formulas shown`;
 grid.innerHTML=arr.length?arr.sort((a,b)=>a.name.localeCompare(b.name)).map(f=>`<div class="card" onclick="show('${f.name}')"><button class="fav" onclick="event.stopPropagation();toggleFav('${f.name}')">${favorites.has(f.name)?"★":"☆"}</button><div class="name">${f.name}</div><div class="cat">${f.cat}</div><div class="syn">${f.syntax}</div></div>`).join(""):`<div class="empty">No formulas found.</div>`;
}
function toggleFav(n){favorites.has(n)?favorites.delete(n):favorites.add(n);localStorage.setItem("efav",JSON.stringify([...favorites]));render()}
function show(n){
 let f=F.find(x=>x.name==n); detail.innerHTML=`<h2>${f.name}</h2><p class="small">${f.cat}</p><h3>Formula</h3><div class="code">${f.syntax}</div><button class="copy" onclick="copyText(${JSON.stringify(f.syntax)})">📋 Copy Formula</button><h3>What it does</h3><p>${f.desc}</p><h3>💼 Practical office example</h3><p>${f.example}</p>`;modal.style.display="flex";
}
function closeModal(){modal.style.display="none"}
function copyText(t){navigator.clipboard?.writeText(t);alert("Formula copied!")}
function generate(){
 let p=problem.value.toLowerCase(), type=genType.value, f;
 if(type=="Lookup"||/lookup|employee id|id.*name|name.*id|match|find.*value/.test(p)) f=F.find(x=>x.name=="XLOOKUP");
 else if(type=="Conditional"||/pass|fail|condition|target|achievement|if /.test(p)) f=F.find(x=>x.name=="IF");
 else if(type=="Text"||/name|text|space|join|combine|extract/.test(p)) f=F.find(x=>x.name=="TEXTJOIN");
 else if(type=="Date"||/date|days|month|year|working day|sla/.test(p)) f=F.find(x=>x.name=="NETWORKDAYS");
 else if(type=="Summary"||/total|sum|average|count|report/.test(p)) f=F.find(x=>x.name=="SUMIFS");
 else f=F.find(x=>x.name=="XLOOKUP");
 genResult.innerHTML=`<div class="hero" style="margin-top:10px"><b>Suggested: ${f.name}</b><div class="code" style="margin-top:8px">${f.syntax}</div><p style="margin-top:8px">${f.desc}</p><button class="copy" onclick="copyText(${JSON.stringify(f.syntax)})">📋 Copy</button></div>`;
}
search.addEventListener("input",render);renderTabs();render();
</script>
</body>
</html>
